<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON TERMINAL // CTF Simulator</title>
<style>
  /* Fully offline: system monospace stack, no external requests */
  :root {
    --green: #00ff41;
    --green-dim: #00cc33;
    --red: #ff003c;
    --amber: #ffb000;
    --cyan: #00e5ff;
    --bg: #0a0e14;
    --panel: #0d1117;
    --panel-light: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --purple: #bc8cff;
    --pink: #ff7b72;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', 'DejaVu Sans Mono', 'WenQuanYi Micro Hei Mono', monospace;
    height: 100vh;
    overflow: hidden;
    font-size: 13px;
  }

  /* ===== BOOT SCREEN ===== */
  #boot-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 1s ease;
    cursor: pointer;
  }
  #boot-screen.fade-out { opacity: 0; pointer-events: none; }
  .boot-text { color: var(--green); font-size: 14px; line-height: 1.8; text-align: left; max-width: 700px; white-space: pre; }
  .boot-text .blink { animation: blink 1s infinite; }
  .boot-progress {
    width: 400px; max-width: 80vw; height: 3px; background: #1a1a1a;
    margin-top: 20px; border-radius: 2px; overflow: hidden;
  }
  .boot-progress-bar {
    height: 100%; width: 0%; background: var(--green);
    transition: width 0.3s ease; box-shadow: 0 0 8px var(--green);
  }
  .boot-hint {
    color: #333; font-size: 11px; margin-top: 16px;
    animation: pulse 2s infinite;
  }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

  /* ===== MAIN LAYOUT ===== */
  #app { display: none; height: 100vh; grid-template-rows: auto 1fr auto; }
  #app.ready { display: grid !important; }

  /* TOP BAR */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    height: 36px;
  }
  .top-bar .left { display: flex; gap: 12px; align-items: center; }
  .top-bar .right { display: flex; gap: 16px; align-items: center; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .top-bar span { color: var(--text-dim); font-size: 12px; }
  .top-bar .highlight { color: var(--green); }

  /* MAIN GRID */
  .main-grid {
    display: grid; grid-template-columns: 240px 1fr 280px;
    height: calc(100vh - 36px - 28px); overflow: hidden;
  }

  /* LEFT PANEL — FILE SYSTEM */
  .left-panel {
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-header {
    padding: 8px 12px; font-size: 11px; text-transform: uppercase;
    color: var(--text-dim); border-bottom: 1px solid var(--border);
    letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center;
  }
  .panel-header .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .file-tree { padding: 8px 0; overflow-y: auto; flex: 1; }
  .file-tree .item {
    padding: 3px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 12px; transition: background .15s;
  }
  .file-tree .item:hover { background: var(--panel-light); }
  .file-tree .item.active { background: rgba(0,255,65,.08); color: var(--green); }
  .file-tree .item .icon { width: 14px; text-align: center; }
  .file-tree .folder .icon { color: var(--amber); }
  .file-tree .file .icon { color: var(--text-dim); }
  .file-tree .nested { padding-left: 28px; }

  /* CENTER — TERMINAL + EDITOR */
  .center-panel { display: flex; flex-direction: column; overflow: hidden; }
  .tabs {
    display: flex; background: var(--panel); border-bottom: 1px solid var(--border);
    height: 32px; align-items: center; padding: 0 8px; gap: 4px;
  }
  .tab {
    padding: 4px 14px; font-size: 12px; border-radius: 4px 4px 0 0;
    cursor: pointer; color: var(--text-dim); border: 1px solid transparent;
    display: flex; align-items: center; gap: 6px;
  }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--border); border-bottom-color: var(--bg); }
  .tab .close { color: var(--text-dim); font-size: 14px; }
  .tab .close:hover { color: var(--red); }

  /* TERMINAL */
  .terminal-container {
    flex: 1; background: var(--bg); overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  #terminal-output {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    scroll-behavior: smooth;
  }
  #terminal-output::-webkit-scrollbar { width: 6px; }
  #terminal-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .term-line { line-height: 1.7; word-break: break-all; }
  .term-line.cmd { color: var(--green); }
  .term-line.info { color: var(--text); }
  .term-line.warn { color: var(--amber); }
  .term-line.err { color: var(--red); }
  .term-line.success { color: var(--green); }
  .term-line.dim { color: var(--text-dim); }
  .term-line.cyan { color: var(--cyan); }
  .term-line.purple { color: var(--purple); }
  .term-line.pink { color: var(--pink); }

  .term-input-line {
    display: flex; align-items: center; gap: 8px; padding: 0 16px 12px;
  }
  .prompt { color: var(--green); white-space: nowrap; font-weight: 700; }
  .prompt .user { color: var(--cyan); }
  .prompt .at { color: var(--text-dim); }
  .prompt .host { color: var(--green); }
  .prompt .path { color: var(--amber); }
  .prompt .sigil { color: var(--green); }
  #cmd-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 13px; caret-color: var(--green);
  }

  /* EDITOR VIEW */
  .editor-view {
    flex: 1; display: none; flex-direction: column; overflow: hidden;
  }
  .editor-toolbar {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: var(--panel-light); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim);
  }
  .editor-toolbar .lang-tag {
    padding: 2px 8px; border-radius: 3px; background: rgba(0,229,255,.1);
    color: var(--cyan); font-size: 11px;
  }
  .editor-body {
    flex: 1; overflow: auto; padding: 12px 16px;
    font-size: 13px; line-height: 1.8; white-space: pre-wrap;
  }
  .editor-body::-webkit-scrollbar { width: 6px; }
  .editor-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* RIGHT PANEL — MISSIONS + HINTS */
  .right-panel {
    background: var(--panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .mission-list { padding: 8px 0; overflow-y: auto; flex: 1; }
  .mission-card {
    margin: 6px 10px; padding: 10px 12px; border-radius: 6px;
    background: var(--panel-light); border: 1px solid var(--border);
    cursor: pointer; transition: all .2s; position: relative;
  }
  .mission-card:hover { border-color: var(--green-dim); }
  .mission-card.active { border-color: var(--green); background: rgba(0,255,65,.03); }
  .mission-card .mc-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .mission-card .mc-desc { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
  .mission-card .mc-diff { font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: auto; }
  .mc-diff.easy { background: rgba(0,255,65,.15); color: var(--green); }
  .mc-diff.medium { background: rgba(255,176,0,.15); color: var(--amber); }
  .mc-diff.hard { background: rgba(255,0,60,.15); color: var(--red); }
  .mission-card .mc-status { position: absolute; top: 10px; right: 12px; font-size: 14px; }
  .mc-status.done { color: var(--green); }
  .mc-status.locked { color: var(--text-dim); }
  .mc-status.active-m { color: var(--amber); }

  /* HINT BOX */
  .hint-box {
    margin: 8px 10px; padding: 10px 12px; border-radius: 6px;
    background: rgba(188,140,255,.06); border: 1px solid rgba(188,140,255,.2);
    font-size: 11px; color: var(--purple); line-height: 1.6;
  }
  .hint-box .hb-title { font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .hint-box .hb-body { color: var(--text-dim); }

  /* BOTTOM BAR */
  .bottom-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 16px; background: var(--panel); border-top: 1px solid var(--border);
    height: 28px; font-size: 11px; color: var(--text-dim);
  }
  .bottom-bar .left-b { display: flex; gap: 16px; }
  .bottom-bar .right-b { display: flex; gap: 12px; }
  .bb-item { display: flex; align-items: center; gap: 4px; }
  .bb-dot { width: 6px; height: 6px; border-radius: 50%; }
  .bb-dot.green { background: var(--green); }
  .bb-dot.amber { background: var(--amber); }
  .bb-dot.red { background: var(--red); }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    width: 500px; max-width: 90vw; overflow: hidden;
    box-shadow: 0 0 40px rgba(0,255,65,.1);
  }
  .modal-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header .title { font-size: 14px; font-weight: 700; color: var(--green); }
  .modal-body { padding: 16px; font-size: 13px; line-height: 1.7; color: var(--text); }
  .modal-body pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto; font-size: 12px;
  }
  .modal-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
  .btn {
    padding: 6px 16px; border-radius: 4px; font-family: inherit; font-size: 12px;
    cursor: pointer; border: 1px solid var(--border); background: var(--panel-light);
    color: var(--text); transition: all .2s;
  }
  .btn:hover { border-color: var(--green); color: var(--green); }
  .btn.primary { background: rgba(0,255,65,.1); border-color: var(--green); color: var(--green); }
  .btn.primary:hover { background: rgba(0,255,65,.2); }

  /* ASCII ART */
  .ascii-art { color: var(--green); font-size: 11px; line-height: 1.2; white-space: pre; }

  /* PROGRESS BAR */
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); border-radius: 2px; transition: width .5s; }

  /* NOTIFICATION */
  .notif {
    position: fixed; top: 50px; right: 20px; z-index: 2000;
    padding: 12px 20px; border-radius: 6px; font-size: 13px;
    transform: translateX(120%); transition: transform .4s cubic-bezier(.4,0,.2,1);
    max-width: 360px;
  }
  .notif.show { transform: translateX(0); }
  .notif.success { background: rgba(0,255,65,.1); border: 1px solid var(--green); color: var(--green); }
  .notif.error { background: rgba(255,0,60,.1); border: 1px solid var(--red); color: var(--red); }
  .notif.info { background: rgba(0,229,255,.1); border: 1px solid var(--cyan); color: var(--cyan); }

  /* CODE HIGHLIGHTING in editor */
  .kw { color: var(--pink); }
  .str { color: #a5d6ff; }
  .num { color: var(--amber); }
  .com { color: #6e7681; }
  .fn { color: var(--cyan); }
  .op { color: var(--purple); }

  /* SCENARIO BANNER */
  .scenario-banner {
    background: linear-gradient(90deg, rgba(0,255,65,.05), transparent);
    border-left: 3px solid var(--green);
    padding: 8px 14px; margin: 8px 0;
    font-size: 12px; color: var(--text-dim); line-height: 1.6;
  }
  .scenario-banner .tag {
    display: inline-block; padding: 1px 8px; border-radius: 3px;
    background: rgba(0,255,65,.15); color: var(--green); font-size: 11px;
    margin-right: 8px;
  }
</style>
</head>
<body>

<!-- ===== BOOT SEQUENCE ===== -->
<div id="boot-screen">
  <div class="boot-text" id="boot-text"></div>
  <div class="boot-progress"><div class="boot-progress-bar" id="boot-progress-bar"></div></div>
  <div class="boot-hint" id="boot-hint">点击或按任意键跳过...</div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app">
  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="left">
      <span class="status-dot"></span>

    </div>
    <div class="right">
      <span id="top-mission">MISSION: --</span>
      <span style="color:var(--border)">|</span>

      <span style="color:var(--border)">|</span>
      <span id="top-time">00:00:00</span>

  </div>

  <!-- MAIN GRID -->
  <div class="main-grid">

    <div class="left-panel">

    </div>

    <!-- CENTER: TERMINAL + EDITOR -->
    <div class="center-panel">
      <div class="tabs" id="tabs">

        <div class="term-input-line">

    </div>

    <!-- RIGHT: MISSIONS -->
    <div class="right-panel">
      <div class="panel-header"><span><span class="dot"></span> ACTIVE OPERATIONS</span><span id="mission-count">0/0</span></div>
      <div class="mission-list" id="mission-list"></div>
      <div class="hint-box" id="hint-box" style="display:none">
        <div class="hb-title">💡 INTEL</div>
        <div class="hb-body" id="hint-body"></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="left-b">
      <span class="bb-item"><span class="bb-dot green"></span> link: secure</span>
      <span class="bb-item"><span class="bb-dot green"></span> enc: AES-256</span>
      <span class="bb-item"><span class="bb-dot amber"></span> trace: 12%</span>
    </div>
    <div class="right-b">
      <span>RAM: <span id="ram-usage">234</span>MB</span>
      <span>CPU: <span id="cpu-usage">3</span>%</span>
      <span>NET: ↑<span id="net-up">0</span> ↓<span id="net-down">0</span> KB/s</span>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="title" id="modal-title">Title</span>
      <span style="cursor:pointer;color:var(--text-dim)" onclick="closeModal()">✕</span>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- NOTIFICATION -->
<div class="notif" id="notif"></div>

<script>
// =====================================================================
//  GLOBAL ERROR GUARD — never stay on black screen
// =====================================================================
window.addEventListener('error', function(e) {
  console.error('Caught error:', e.error || e.message);
  const bs = document.getElementById('boot-screen');
  if (bs) {
    bs.style.display = 'none';
    const app = document.getElementById('app');
    if (app) {
      app.classList.add('ready');
      app.style.display = 'grid';
      const out = document.getElementById('terminal-output');
      if (out) {
        out.innerHTML = '<div style="color:#ff003c;padding:10px">⚠ 系统警告: 检测到异常，已启用安全模式</div>' +
                       '<div style="color:#00ff41;padding:10px">输入 "help" 继续操作</div>';
      }
      const term = document.getElementById('terminal-container');
      if (term) term.style.display = 'flex';
    }
  }
});

// =====================================================================
//  BOOT SEQUENCE
// =====================================================================
const bootLines = [
  "[    0.000000] Nexus OS booting...",
  "[    0.183492] CPU: Intel Xeon E5-2699 v4 @ 2.20GHz",
  "[    0.301847] Memory: 16384MB available",
  "[    0.452918] Initializing network stack... OK",
  "[    0.587201] Loading crypto modules... OK",
  "[    0.712394] Mounting /dev/sda1 on /... OK",
  "[    0.891234] Starting sshd... OK",
  "[    1.023481] Establishing secure tunnel... OK",
  "[    1.156782] Loading user profile: guest... OK",
  "[    1.298341] Scanning for available operations...",
  "[    1.487123] WARNING: Unauthorized access detected on subnet 10.0.0.0/24",
  "[    1.623489] 3 target hosts identified",
  "[    1.789123] Welcome to NEXUS-OS, guest.",
  "[    1.790000] Type 'help' to begin.",
  "[    1.790001] <span class='blink'>▊</span>"
];

async function runBoot() {
  const el = document.getElementById('boot-text');
  const progressBar = document.getElementById('boot-progress-bar');
  const hint = document.getElementById('boot-hint');
  let skipped = false;

  // Safety timeout: if anything goes wrong, force-start after 8 seconds
  const safetyTimer = setTimeout(() => {
    skipped = true;
    enterMainApp();
  }, 8000);

  // Allow user to skip boot with click or key
  const skipBoot = () => {
    if (skipped) return;
    skipped = true;
    clearTimeout(safetyTimer);
    enterMainApp();
  };
  document.getElementById('boot-screen').addEventListener('click', skipBoot);
  document.addEventListener('keydown', skipBoot, { once: true });

  for (let i = 0; i < bootLines.length; i++) {
    if (skipped) break;
    el.innerHTML += bootLines[i] + '\n';
    const pct = ((i + 1) / bootLines.length) * 100;
    if (progressBar) progressBar.style.width = pct + '%';
    await sleep(60 + Math.random() * 80);
  }

  if (!skipped) {
    hint.textContent = '启动完成, 点击进入系统...';
    hint.style.color = 'var(--green)';
    progressBar.style.width = '100%';
    await sleep(500);
    skipped = true;
    clearTimeout(safetyTimer);
    enterMainApp();
  }
}

function enterMainApp() {
  const bs = document.getElementById('boot-screen');
  bs.classList.add('fade-out');
  setTimeout(() => {
    bs.style.display = 'none';
    const app = document.getElementById('app');
    app.classList.add('ready');
    app.style.display = 'grid';
    app.style.opacity = '1';
    try {
      initApp();
    } catch(e) {
      console.error('Init error:', e);
      // Fallback: at least show the app shell
      document.getElementById('terminal-output').innerHTML =
        '<div class="term-line err">⚠ 初始化警告: ' + e.message + '</div>' +
        '<div class="term-line info">输入 "help" 开始。</div>';
    }
  }, 800);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// =====================================================================
//  MISSION DATA — each mission hides CTF knowledge organically
// =====================================================================
const MISSIONS = [
  {
    id: 'recon-01',
    title: '01 // 靶场侦察',
    desc: '扫描目标网络 10.0.0.0/24，识别存活主机与开放端口。情报显示有一台内网服务器藏有重要文件。',
    diff: 'easy',
    status: 'active',
    intel: '提示：现实世界中，nmap 是侦察利器。试试 nmap -sn 做主机发现，nmap -sV 做服务识别。',
    steps: [
      { check: (cmd) => /nmap\s+-sn\s+10\.0\.0/.test(cmd), msg: '主机发现完成。发现 3 台存活主机: 10.0.0.12, 10.0.0.45, 10.0.0.100' },
      { check: (cmd) => /nmap\s+-sV\s+10\.0\.0\.100/.test(cmd), msg: '端口扫描完成。10.0.0.100 开放: 22/tcp(SSH), 80/tcp(HTTP), 3306/tcp(MySQL)' },
      { check: (cmd) => /nmap\s+-sC\s+10\.0\.0\.100/.test(cmd) || /nmap\s+--script/.test(cmd), msg: '脚本扫描发现: HTTP 目录遍历漏洞 (CVE-2023-XXXXX), SSH 允许密码认证' }
    ],
    reward: 100,
    flags: ['SCAN_COMPLETE']
  },
  {
    id: 'web-01',
    title: '02 // 网页渗透',
    desc: '目标 10.0.0.100 运行着一个 Web 应用。找到一个入口点，获取初始访问权限。',

// =====================================================================

// =====================================================================
function termLine(html, cls = 'info') {
  const out = document.getElementById('terminal-output');
  const div = document.createElement('div');
  div.className = `term-line ${cls}`;
  div.innerHTML = html;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function termCmdLine(cmd) {
  const prompt = `<span class="user">${state.user}</span><span class="at">@</span><span class="host">${state.host}</span><span class="path">:${state.cwd}$</span>`;
  termLine(`${prompt} ${escapeHtml(cmd)}`, 'cmd');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// =====================================================================
//  INPUT HANDLING
// =====================================================================
function bindInput() {
  const input = document.getElementById('cmd-input');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const cmd = input.value.trim();
      input.value = '';
      if (cmd) {
        termCmdLine(cmd);
        processCommand(cmd);
      }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      autoComplete(input);
    }
  });
  // keep focus
  document.addEventListener('click', () => input.focus());
}

function processCommand(cmd) {
  const args = cmd.split(/\s+/);
  const c = args[0].toLowerCase();

  // MISSION PROGRESSION — check all active missions
  checkMissionProgress(cmd);

  switch(c) {
    case 'help': cmd_help(); break;
    case 'ls': cmd_ls(args); break;
    case 'cd': cmd_cd(args); break;
    case 'cat': cmd_cat(args); break;
    case 'pwd': termLine(state.cwd, 'info'); break;
    case 'whoami': termLine(state.user, 'info'); break;
    case 'id': termLine(`uid=1000(${state.user}) gid=1000(${state.user}) groups=1000(${state.user})`, 'info'); break;
    case 'uname': termLine('Linux nexus 5.15.0 #1 SMP x86_64 GNU/Linux', 'info'); break;
    case 'clear': document.getElementById('terminal-output').innerHTML = ''; break;
    case 'missions': showMissions(); break;
    case 'mission': showMissions(); break;
    case 'intel': showIntel(); break;

function cmd_ls(args) {
  let path = state.cwd;
  let showHidden = false;
  let longFormat = false;
  
  for (const a of args.slice(1)) {
    if (a === '-la' || a === '-al' || a === '-a') showHidden = true;
    if (a === '-la' || a === '-al' || a === '-l') longFormat = true;
    if (a === '-lh' || a === '-h') longFormat = true;
    if (!a.startsWith('-')) path = resolvePath(a);
  }
  
  const node = FILESYSTEM[path];
  if (!node) { termLine(`ls: 无法访问'${args[1]||''}': 没有那个文件或目录`, 'err'); return; }
  if (node.type !== 'dir') { termLine(args[1] || path, 'info'); return; }
  
  const items = node.children || [];
  const filtered = showHidden ? items : items.filter(i => !i.startsWith('.'));
  
  if (longFormat) {
    filtered.forEach(item => {
      const fullPath = path === '/' ? '/' + item : path + '/' + item;
      const f = FILESYSTEM[fullPath];
      if (f) {
        const perms = f.type === 'dir' ? 'drwxr-xr-x' : '-rw-r--r--';
        const size = f.content ? Math.min(f.content.length * 10, 9999) : (f.type==='dir'?4096:0);
        const date = 'Jul 15 08:23';
        const name = f.type === 'dir' ? `<span style="color:var(--amber)">${item}</span>` : item;
        termLine(`<span class="dim">${perms} 1 guest guest ${String(size).padStart(5)} ${date}</span> ${name}`, 'info');
      }
    });
  } else {
    const parts = filtered.map(item => {
      const fullPath = path === '/' ? '/' + item : path + '/' + item;
      const f = FILESYSTEM[fullPath];
      if (f && f.type === 'dir') return `<span style="color:var(--amber)">${item}/</span>`;
      return item;
    });
    termLine(parts.join('  '), 'info');
  }
}

function cmd_cd(args) {
  if (!args[1] || args[1] === '~') { state.cwd = '/home/guest'; updatePrompt(); return; }
  if (args[1] === '..') {
    const parts = state.cwd.split('/').filter(Boolean);
    parts.pop();
    state.cwd = parts.length ? '/' + parts.join('/') : '/';
    updatePrompt();
    return;
  }
  if (args[1] === '/') { state.cwd = '/'; updatePrompt(); return; }
  
  const target = resolvePath(args[1]);
  const node = FILESYSTEM[target];
  if (!node) { termLine(`cd: 没有那个文件或目录: ${args[1]}`, 'err'); return; }
  if (node.type !== 'dir') { termLine(`cd: 不是目录: ${args[1]}`, 'err'); return; }
  if (target === '/root' && state.user !== 'root') { termLine(`cd: 权限不够: /root`, 'err'); return; }
  
  state.cwd = target;
  updatePrompt();
}

function cmd_cat(args) {
  if (!args[1]) { termLine('cat: 缺少操作数', 'err'); return; }
  const path = resolvePath(args[1]);
  const node = FILESYSTEM[path];
  if (!node) { termLine(`cat: ${args[1]}: 没有那个文件或目录`, 'err'); return; }
  if (node.type === 'dir') { termLine(`cat: ${args[1]}: 是一个目录`, 'err'); return; }
  
  // Special handling for binary-like files
  if (path === '/opt/keygen') {
    termLine('⚠ 这是二进制文件, 直接查看会乱码。', 'warn');
    termLine('提示: 使用 "strings keygen" 提取可读字符串', 'dim');
    termLine('    使用 "objdump -d keygen" 反汇编', 'dim');
    return;
  }
  if (path === '/usr/bin/vuln_server') {
    termLine('⚠ 这是 SUID 二进制文件 (漏洞程序)', 'warn');
    termLine('提示: 使用 "checksec vuln_server" 检查保护机制', 'dim');
    termLine('    使用 "gdb vuln_server" 调试分析', 'dim');
    return;
  }
  if (path.includes('disk.img') || path.includes('traffic.pcap') || path.includes('cover.png') || path.includes('.enc') || path.includes('.kdbx')) {
    termLine(`⚠ 这是 ${path.split('.').pop()} 格式文件, 需要使用专门工具分析:`, 'warn');
    if (path.includes('disk.img')) termLine('  foremost -i disk.img -o recovered/', 'dim');
    if (path.includes('traffic.pcap')) termLine('  tshark -r traffic.pcap 或 strings traffic.pcap', 'dim');
    if (path.includes('cover.png')) termLine('  zsteg cover.png 或 steghide extract -sf cover.png', 'dim');
    if (path.includes('.enc')) termLine('  openssl aes-256-cbc -d -in message.enc -out decrypted.txt', 'dim');
    if (path.includes('.kdbx')) termLine('  需要 KeePass 主密钥才能打开', 'dim');
    return;
  }
  
  const lines = node.content.split('\n');
  lines.forEach(line => termLine(escapeHtml(line), 'info'));
}

function checkMissionProgress(cmd) {
  const mission = state.missions.find(m => m.id === state.currentMission);
  if (!mission) return;
  if (mission.status === 'done') return;
  
  const steps = mission.steps;
  const idx = state.stepIndex[mission.id] || 0;
  if (idx >= steps.length) return;
  
  const step = steps[idx];
  if (step.check(cmd)) {
    state.stepIndex[mission.id] = idx + 1;
    termLine(`✓ ${step.msg}`, 'success');
    
    // Check if mission complete
    if (state.stepIndex[mission.id] >= steps.length) {
      completeMission(mission);
    }
    renderMissions();
  }
}

function completeMission(mission) {
  mission.status = 'done';
  state.score += mission.reward;
  mission.flags.forEach(f => state.completedFlags.add(f));
  
  // Unlock next missions
  const idx = MISSIONS.findIndex(m => m.id === mission.id);
  if (idx + 1 < MISSIONS.length) {
    const next = MISSIONS[idx + 1];
    next.status = 'active';
    state.unlockedMissions.add(next.id);
  }
  
  showNotif(`🏁 任务完成: ${mission.title}\n+${mission.reward} 积分`, 'success');
  
  // Special unlocks
  if (mission.id === 'web-01') {
    // After web access, unlock more
  }
  
  updateTopBar();
  renderMissions();
  
  // Auto-switch to next active mission
  setTimeout(() => {
    const nextActive = state.missions.find(m => m.status === 'active');
    if (nextActive) setActiveMission(nextActive.id);
  }, 2000);
}

function resolvePath(p) {
  if (!p) return state.cwd;
  if (p.startsWith('/')) {
    // absolute
    if (p === '~') return '/home/guest';
    return normalizePath(p);
  }
  // relative
  if (state.cwd === '/') return normalizePath('/' + p);
  return normalizePath(state.cwd + '/' + p);
}

function normalizePath(p) {
  const parts = p.split('/').filter(Boolean);
  const stack = [];
  for (const part of parts) {
    if (part === '.') continue;
    if (part === '..') stack.pop();
    else stack.push(part);
  }
  return '/' + stack.join('/');
}

function addVirtualFile(path, content) {
  FILESYSTEM[path] = { type: 'file', content };
  // ensure parent dir exists in tree
  const parent = path.substring(0, path.lastIndexOf('/'));
  if (FILESYSTEM[parent] && FILESYSTEM[parent].children) {
    const name = path.substring(path.lastIndexOf('/') + 1);
    if (!FILESYSTEM[parent].children.includes(name)) {
      FILESYSTEM[parent].children.push(name);
    }
  }
  renderFileTree();
}

// =====================================================================
//  RENDERING
// =====================================================================
function renderFileTree() {
  const container = document.getElementById('file-tree');
  container.innerHTML = '';
  
  function renderNode(path, depth = 0) {
    const node = FILESYSTEM[path];
    if (!node) return;
    
    if (node.type === 'dir') {
      const dirItem = document.createElement('div');
      dirItem.className = 'item folder';
      dirItem.style.paddingLeft = (12 + depth * 16) + 'px';
      dirItem.innerHTML = `<span class="icon">📁</span> ${path.split('/').pop() || '/'}`;
      dirItem.onclick = () => {
        state.cwd = path;
        updatePrompt();
        renderFileTree();
      };
      container.appendChild(dirItem);
      
      if (node.children) {
        // Show children only for current path or root
        const shouldExpand = path === state.cwd || path === '/' || state.cwd.startsWith(path + '/');
        if (shouldExpand || depth < 1) {
          node.children.forEach(child => {
            const childPath = path === '/' ? '/' + child : path + '/' + child;
            const childNode = FILESYSTEM[childPath];
            if (childNode) {
              if (childNode.type === 'dir') {
                renderNode(childPath, depth + 1);
              } else {
                const fileItem = document.createElement('div');
                fileItem.className = 'item file' + (childPath === '/root/master.key' && state.user !== 'root' ? ' locked' : '');
                fileItem.style.paddingLeft = (12 + (depth + 1) * 16) + 'px';
                const icon = getFileIcon(child);
                fileItem.innerHTML = `<span class="icon">${icon}</span> ${child}`;
                fileItem.onclick = () => {
                  if (childPath === '/root/master.key' && state.user !== 'root') {
                    showNotif('需要 root 权限!', 'error');
                    return;
                  }
                  // cat the file
                  termCmdLine(`cat ${child}`);
                  cmd_cat(['cat', child]);
                };
                container.appendChild(fileItem);
              }
            }
          });
        }
      }
    }
  }
  
  renderNode('/', 0);
}

function getFileIcon(name) {
  if (name.endsWith('.txt')) return '📄';
  if (name.endsWith('.php')) return '🐘';
  if (name.endsWith('.png') || name.endsWith('.jpg')) return '🖼';
  if (name.endsWith('.zip') || name.endsWith('.tar.gz')) return '📦';
  if (name.endsWith('.pcap')) return '📡';
  if (name.endsWith('.img')) return '💿';
  if (name.endsWith('.enc')) return '🔐';
  if (name.endsWith('.kdbx')) return '🔑';
  if (name.endsWith('.key') || name.endsWith('.pem') || name.endsWith('.rsa')) return '🗝';
  if (name.endsWith('.sql')) return '🗄';
  if (!name.includes('.')) return '⚙';
  return '📄';
}

function renderMissions() {
  const container = document.getElementById('mission-list');
  container.innerHTML = '';
  
  state.missions.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mission-card' + (m.id === state.currentMission ? ' active' : '');
    
    let statusIcon = '🔒';
    if (m.status === 'done') statusIcon = '✅';
    else if (m.status === 'active') statusIcon = '🔄';
    
    card.innerHTML = `
      <div class="mc-title">
        ${m.title}
        <span class="mc-diff ${m.diff}">${m.diff.toUpperCase()}</span>
      </div>
      <div class="mc-desc">${m.desc.substring(0, 60)}...</div>
      <div class="mc-status ${m.status === 'done' ? 'done' : (m.status === 'active' ? 'active-m' : 'locked')}">${statusIcon}</div>
    `;
    
    if (m.status !== 'locked') {
      card.onclick = () => setActiveMission(m.id);
    }
    container.appendChild(card);
  });
  
  // Hint box
  const current = state.missions.find(m => m.id === state.currentMission);
  const hintBox = document.getElementById('hint-box');
  if (current && current.status !== 'done') {
    hintBox.style.display = 'block';
    document.getElementById('hint-body').textContent = current.intel;
  } else {
    hintBox.style.display = 'none';
  }
  
  // Mission count
  const done = state.missions.filter(m => m.status === 'done').length;
  document.getElementById('mission-count').textContent = `${done}/${state.missions.length}`;
}
